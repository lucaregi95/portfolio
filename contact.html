<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Portfolio BTS SIO SLAM</title>
<meta name="description" content="Portfolio d'un étudiant en BTS SIO option SLAM : projets, compétences, veille technologique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main id="main">
<section class="wrap narrow">
  <h1>Contact</h1>
  <p class="lead">Une question, une proposition d’alternance ? Écrivez-moi.</p>
  <form id="form-contact" action="https://formspree.io/f/VOTRE_ID" method="POST" novalidate>
    <label for="nom">Nom</label>
    <input id="nom" name="nom" type="text" autocomplete="name" required>
    <small class="err" id="err-nom"></small>
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <small class="err" id="err-email"></small>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>
    <small class="err" id="err-message"></small>
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
    <button class="btn primary" type="submit">Envoyer le message</button>
    <p id="form-status" role="status"></p>
  </form>
  <p class="muted">Vous préférez écrire directement ? <a id="lnk-mail" href="#">Envoyer un e-mail</a></p>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
